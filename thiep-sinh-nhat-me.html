<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiệp sinh nhật mẹ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root{
    --bg1:#f7efe4; --bg2:#efe1d3;
    --cream:#fbf6ee; --paper:#fffaf2;
    --mocha:#8a5a44; --mocha-dark:#5e3b2c;
    --rose:#e8b4bc; --lav:#c9c3e6; --sage:#b7c4a3; --gold:#d9b36c;
    --ink:#4a3328;
    --card-w: min(80vw, 430px, calc((100vh - 150px) * 0.689));
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #fbe6ea 0, transparent 40%),
      radial-gradient(circle at 85% 80%, #e6e3f6 0, transparent 42%),
      radial-gradient(circle at 80% 15%, #f3ecd6 0, transparent 35%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh; min-height:100dvh;
  }

  /* ---------- Confetti ---------- */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .piece{
    position:absolute; top:-30px;
    width:var(--w); height:var(--h);
    background:var(--c); border-radius:var(--r);
    opacity:.85;
    animation:fall var(--dur) linear var(--delay) forwards;
  }
  @keyframes fall{
    0%  {transform:translate(0,0) rotate(0deg)}
    25% {transform:translate(calc(var(--drift)*.5), 27vh) rotate(calc(var(--spin)*.25))}
    50% {transform:translate(calc(var(--drift)*-.3), 55vh) rotate(calc(var(--spin)*.5))}
    75% {transform:translate(calc(var(--drift)*.7), 82vh) rotate(calc(var(--spin)*.75))}
    100%{transform:translate(var(--drift), 110vh) rotate(var(--spin));opacity:.6}
  }

  /* ---------- Stage ---------- */
  .stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

  /* ---------- Envelope ---------- */
  #envelopeWrap{
    display:flex;flex-direction:column;align-items:center;gap:30px;
    cursor:pointer; transition:opacity .7s ease, transform .7s ease;
  }
  #envelopeWrap.gone{opacity:0;transform:translateY(40px) scale(.94);pointer-events:none}
  .envelope{
    --line:#9c8a6e;
    position:relative;
    width:min(80vw,400px); aspect-ratio:625/410;
    background:#f3ecdf;                 /* inside of the envelope */
    border:3px solid var(--line);
    border-radius:12px;
    box-shadow:0 22px 45px rgba(110,95,70,.22), 0 6px 14px rgba(110,95,70,.10);
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .envelope.open{animation:none}
  .envelope .peek{
    position:absolute;left:9%;right:9%;top:8%;height:82%;z-index:2;
    background:#fffdf8;border:2px solid #c9bda6;border-radius:6px;
    transition:transform .8s ease .45s;
  }
  .envelope.open .peek{transform:translateY(-48%)}
  .envelope .pocket{                    /* front panel below the flap */
    position:absolute;inset:0;z-index:4;border-radius:9px;
    background:#faf6ee;
    clip-path:polygon(0 0,50% 57.5%,100% 0,100% 100%,0 100%);
  }
  .envelope .flap{
    position:absolute;left:0;right:0;top:0;height:57.5%;z-index:5;
    background:#faf6ee;border-radius:9px 9px 0 0;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform .7s cubic-bezier(.6,.05,.3,1), z-index 0s .35s;
  }
  .envelope.open .flap{transform:scaleY(-1);z-index:1}
  .envelope svg{position:absolute;pointer-events:none;overflow:visible}
  .envelope .lines{inset:0;width:100%;height:100%;z-index:4}
  .envelope .flapline{left:0;top:0;width:100%;height:57.5%;z-index:5;
    transform-origin:top center;
    transition:transform .7s cubic-bezier(.6,.05,.3,1), z-index 0s .35s}
  .envelope.open .flapline{transform:scaleY(-1);z-index:1}

  .hint{
    font-weight:500;
    font-size:clamp(15px,4.2vw,18px);
    color:var(--mocha-dark);
    background:rgba(255,250,242,.75);
    border:1.5px dashed rgba(138,90,68,.45);
    padding:10px 22px;border-radius:999px;
    white-space:nowrap;
    box-shadow:0 6px 16px rgba(94,59,44,.08);
    animation:pulse 2s ease-in-out infinite;
    user-select:none;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* ---------- Postcard ---------- */
  #cardWrap{
    display:none;flex-direction:column;align-items:center;gap:22px;
  }
  #cardWrap.show{display:flex}
  .scene{
    width:var(--card-w);
    aspect-ratio:1100/1596;
    perspective:1600px;
    opacity:0;transform:scale(.6) translateY(30px);
  }
  #cardWrap.show .scene{animation:pop .9s cubic-bezier(.2,1.2,.35,1) .1s forwards}
  @keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
  .card{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.45,.05,.25,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:14px;overflow:hidden;
    box-shadow:0 22px 50px rgba(94,59,44,.28), 0 4px 10px rgba(94,59,44,.12);
  }
  .front{background:#fff;padding:10px}
  .front img{
    width:100%;height:100%;object-fit:cover;display:block;border-radius:8px;
  }
  .back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(201,195,230,.18) 31px 32px),
      radial-gradient(circle at 20% 15%, #fdeef0 0, transparent 45%),
      radial-gradient(circle at 85% 90%, #eef0e3 0, transparent 45%),
      var(--paper);
    border:10px solid #fff;
    display:flex;align-items:center;justify-content:center;
    padding:9% 10%;
  }
  .back::before{ /* inner frame */
    content:"";position:absolute;inset:12px;
    border:1.5px solid rgba(217,179,108,.55);border-radius:8px;pointer-events:none;
  }
  .back .stampbox{
    position:absolute;top:22px;right:22px;
    width:calc(var(--card-w)*.15);aspect-ratio:4/5;
    border:2px dashed rgba(201,118,131,.55);border-radius:4px;
    display:grid;place-items:center;
    background:rgba(232,180,188,.18);
    transform:rotate(4deg);
  }
  .back .stampbox svg{width:55%;height:55%}
  .back .corner{
    position:absolute;bottom:20px;left:22px;font-size:calc(var(--card-w)*.06);opacity:.75
  }
  .message{
    text-align:center;position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    gap:calc(var(--card-w)*.04);
  }
  .message .title{
    font-weight:700;color:#c46f7e;
    font-size:calc(var(--card-w)*.058);
    line-height:1.35;
  }
  .message .divider{
    display:flex;align-items:center;gap:8px;color:var(--gold);
    font-size:calc(var(--card-w)*.035);
  }
  .message .divider::before,.message .divider::after{
    content:"";width:calc(var(--card-w)*.13);height:1.5px;background:currentColor;opacity:.6;border-radius:2px;
  }
  .message .body{
    font-weight:400;
    font-size:calc(var(--card-w)*.044);
    line-height:1.75;color:var(--ink);
  }
  .message .body.soft{color:var(--mocha);font-style:italic}

  #flipHint{animation:pulse 2s ease-in-out infinite; cursor:pointer;opacity:0}
  #cardWrap.show #flipHint{animation:fadeIn .6s ease 1s forwards, pulse 2s ease-in-out 1.6s infinite}
  @keyframes fadeIn{to{opacity:1}}

  @media (max-height:560px){
    :root{--card-w:min(80vw,430px,calc((100vh - 110px) * 0.689))}
    #cardWrap{gap:12px}
  }
</style>
</head>

        <line x1="1" y1="99" x2="37" y2="51" stroke="#c5bba6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
        <line x1="99" y1="99" x2="63" y2="51" stroke="#c5bba6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      </svg>
      <div class="flap"></div>

            <div class="body">Con chúc mẹ sức khoẻ dồi dào, có thật nhiều niềm vui và công việc thật thuận lợi ạ!!</div>
            <div class="body soft">16/10/2026</div>
            <div class="divider">♡</div>
          </div>
          <div class="corner">🌷</div>
        </div>
      </div>
    </div>
    <div class="hint" id="flipHint" role="button" tabindex="0">Ấn để xoay thiệp</div>
  </div>
</div>

<script>
  const PASTELS = ['#f6c6cf','#cfc6ee','#c9e2d0','#fbe3b8','#bfe0ee','#f3d1e6','#fff1c9','#e4d6c6'];
  const layer = document.getElementById('confetti');

  function makePiece(delayMax){
    const p = document.createElement('span');
    p.className = 'piece';
    const size = 6 + Math.random()*8;
    const shape = Math.random();
    const isCircle = shape < .35, isStrip = shape > .75;
    p.style.setProperty('--w', (isStrip ? size*.45 : size) + 'px');
    p.style.setProperty('--h', (isStrip ? size*1.6 : isCircle ? size : size*.7) + 'px');
    p.style.setProperty('--r', isCircle ? '50%' : '2px');
    p.style.setProperty('--c', PASTELS[Math.floor(Math.random()*PASTELS.length)]);
    p.style.setProperty('--drift', (Math.random()*140 - 70) + 'px');
    p.style.setProperty('--spin', (Math.random()*720 - 360) + 'deg');
    p.style.setProperty('--dur', (7 + Math.random()*6) + 's');
    p.style.setProperty('--delay', (Math.random()*delayMax) + 's');
    p.style.left = (Math.random()*100) + 'vw';
    p.addEventListener('animationend', () => p.remove());
    layer.appendChild(p);
  }

  function launchConfetti(){
    const burst = window.innerWidth < 600 ? 45 : 70;
    for (let i = 0; i < burst; i++) makePiece(3);
    // gentle continuous drizzle
    setInterval(() => {
      if (document.hidden) return;
      if (layer.childElementCount < 90) makePiece(0);
    }, 260);
  }

  const envWrap = document.getElementById('envelopeWrap');
  const env = document.getElementById('envelope');
  const cardWrap = document.getElementById('cardWrap');
  const card = document.getElementById('card');
  const flipHint = document.getElementById('flipHint');
  let opened = false;

  function openLetter(){
    if (opened) return;
    opened = true;
        env.classList.add('open');
    setTimeout(() => envWrap.classList.add('gone'), 1300);
    setTimeout(() => {
      envWrap.style.display = 'none';
      cardWrap.classList.add('show');
      launchConfetti();
    }, 2000);
  }
  function flip(){ card.classList.toggle('flipped'); }

  envWrap.addEventListener('click', openLetter);
  card.addEventListener('click', flip);
  flipHint.addEventListener('click', flip);
  [envWrap, flipHint].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  }));
</script>
</body>
</html>
